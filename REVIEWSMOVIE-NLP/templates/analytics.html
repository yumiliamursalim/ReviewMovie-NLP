<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Insights ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #0b1120; color: white; font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.5); padding: 50px; border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; max-width: 800px;
        }
        h1 { background: linear-gradient(to right, #f472b6, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; margin-bottom: 40px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-card {
            background: rgba(15, 23, 42, 0.8); padding: 30px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .label { color: #f472b6; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .value { font-size: 28px; font-weight: bold; color: white; }
        
        .back-btn { margin-top: 40px; display: inline-block; color: #94a3b8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Movie Insights 📈</h1>
        <div class="grid">
            <div class="stat-card">
                <span class="label">Total Bank Film</span>
                <div class="value">{{ stats.total }}</div>
            </div>
            <div class="stat-card">
                <span class="label">Positive Vibes</span>
                <div class="value">{{ stats.vibe_score }}</div>
            </div>
            <div class="stat-card">
                <span class="label">Trending Now</span>
                <div class="value">{{ stats.trending }}</div>
            </div>
            <div class="stat-card">
                <span class="label">Community Status</span>
                <div class="value">{{ stats.status }}</div>
            </div>
        </div>
        <a href="/" class="back-btn">← Back to Feed</a>
    </div>
</body>
</html>
